name: Compiler Bati

# À la main (onglet Actions > Compiler Bati > Run workflow) ou en poussant un tag v* (v0.1.0, v0.2.0…).
# Publier une Release crée son étiquette de version, ce qui relance ce workflow : il s'arrête alors sans compiler ni échouer.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: compiler-bati
  cancel-in-progress: false

jobs:
  # Une seule Release brouillon, créée avant les deux compilations pour qu'elles y déposent leur fichier.
  brouillon:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          # Sans la vraie clé publique, l'appli proposerait des mises à jour qu'elle ne pourrait jamais installer.
          if [ "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" = "A_REMPLIR_CLE_PUBLIQUE_BATI" ]; then
            echo "::error::Collez la clé publique de mise à jour dans plugins.updater.pubkey de src-tauri/tauri.conf.json (voir README)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION de src-tauri/tauri.conf.json"
            exit 1
          fi
          RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate)
          if [ -n "$(echo "$RELEASES" | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t and .draft == false) | .id')" ]; then
            # Étiquette poussée par la publication de la Release : rien à compiler, on s'arrête sans erreur.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "La version $VERSION est déjà publiée : rien à compiler."
              exit 0
            fi
            echo "::error::La version $VERSION est déjà publiée. Montez la version dans src-tauri/tauri.conf.json."
            exit 1
          fi
          ID=$(echo "$RELEASES" | jq -r --arg t "$TAG" '[.[] | select(.tag_name == $t and .draft == true)][0].id // empty')
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Bati $VERSION" -F draft=true \
              -f body="Windows : Bati_${VERSION}_x64-setup.exe · Mac (Apple et Intel) : Bati_${VERSION}_universal.dmg" \
              --jq .id)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  compiler:
    needs: brouillon
    if: needs.brouillon.outputs.id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ""
            args: "--bundles nsis"
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Dépose aussi les fichiers de mise à jour signés (.exe.sig, .app.tar.gz + .sig) et latest.json,
      # complété par chaque compilation (Windows, puis Mac pour les puces Apple et Intel).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.brouillon.outputs.id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  # Les deux compilations complètent le même latest.json : si elles ont fini au même moment, l'une a pu effacer
  # la part de l'autre. On le vérifie avant que la Release ne puisse être publiée.
  verifier:
    needs: [brouillon, compiler]
    if: needs.brouillon.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.brouillon.outputs.id }}
        run: |
          ASSET=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$ASSET" ]; then
            echo "::error::latest.json manque dans la Release brouillon."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" > latest.json
          cat latest.json
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            if [ -z "$(jq -r --arg p "$p" '.platforms[$p].signature // empty' latest.json)" ]; then
              echo "::error::latest.json n'a pas la plateforme $p : relancez le workflow (Run workflow), il complète la même Release brouillon."
              exit 1
            fi
          done
