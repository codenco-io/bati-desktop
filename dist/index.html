<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bati</title>
  <style>
    :root {
      --bg: #0a0d15;
      --surface: #141828;
      --blue: #4a8cff;
      --ink: #ffffff;
      --ink-2: rgba(255, 255, 255, 0.82);
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--blue) 14%, transparent), transparent 60%), var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 40px 32px;
      text-align: center;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      border: 1px solid var(--line);
      border-radius: 20px;
      opacity: 0;
      transition: opacity .3s ease;
    }
    main.visible { opacity: 1; }
    #demarrage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--bg);
    }
    #demarrage[hidden] { display: none; }
    #demarrage img { width: 72px; height: 72px; border-radius: 17px; animation: respire 2.4s ease-in-out infinite; }
    /* Chargement : un trait bleu qui glisse dans une piste discrète. */
    .chargement { position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 3px; background: var(--line); }
    .chargement::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: inherit;
      background: var(--blue);
      animation: glisse 1.2s ease-in-out infinite;
    }
    @keyframes respire { 50% { transform: translateY(-4px) scale(1.03); } }
    @keyframes glisse { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #demarrage img { animation: none; }
      .chargement::after { width: 100%; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 700; }
    p { margin: 0 0 28px; color: var(--ink-2); line-height: 1.5; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 28px;
      background: var(--blue);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="demarrage" role="status" aria-label="Chargement de Bati"><img src="bati.png" alt=""><div class="chargement"></div></div>
  <main id="carte" aria-live="polite">
    <img src="bati.png" alt="">
    <h1>Pas de connexion</h1>
    <p>Bati a besoin d'internet pour ouvrir votre espace. Vérifiez votre connexion, puis réessayez.</p>
    <button id="reessayer" type="button">Réessayer</button>
  </main>
  <script src="hors-ligne.js"></script>
</body>
</html>
